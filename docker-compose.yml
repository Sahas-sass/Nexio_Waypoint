# Full Waypoint stack. Data and auth live in Supabase (cloud), so there is no local
# database container: `db-setup` applies migrations + demo data to the Supabase project
# configured in ./.env (see .env.example), then the API and web portals start.
#
#   cp .env.example .env   # fill in Supabase URL/keys, DB_PASSWORD, DEMO_PASSWORD
#   docker compose up --build

services:
  db-setup:
    image: node:22-alpine
    working_dir: /repo
    env_file: .env
    volumes:
      - ./package.json:/repo/package.json:ro
      - ./package-lock.json:/repo/package-lock.json:ro
      - ./scripts:/repo/scripts:ro
      - ./migrations:/repo/migrations:ro
      - ./seeds:/repo/seeds:ro
      - db-setup-modules:/repo/node_modules
    command: >
      sh -c "npm ci --no-audit --no-fund &&
             node scripts/migrate.js &&
             node scripts/seed-auth.js &&
             node scripts/run-seed.js seeds/006_demo_day.sql"
    restart: "no"

  api-backend:
    build:
      context: ./api-backend
    container_name: waypoint-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      db-setup:
        condition: service_completed_successfully

  web-portals:
    build:
      context: ./web-portals
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: waypoint-web
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      api-backend:
        condition: service_started

volumes:
  db-setup-modules:
